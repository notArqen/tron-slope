<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>tron-slope</title>
    <link rel="icon" href="data:," />
  </head>
  <body>
    <canvas id="c"></canvas>
    <div id="hud">
      <div class="score"></div>
      <div class="best"></div>
      <div class="msg"></div>
      <div class="seed"></div>
      <div class="speed"></div>
      <div class="hint">← → / A D steer · esc pause · ` settings</div>
      <div class="auto" hidden>AUTOPLAY · press ← → to take over</div>
    </div>
    <section id="menu" class="first" hidden aria-label="Main menu">
      <h1 class="m-title">TRON<i></i>SLOPE</h1>
      <p class="m-tag">All downhill from here.</p>
      <p class="m-desc">An endless neon slope through a city in the rain. Steer. It only gets faster.</p>
      <div class="m-actions">
        <button class="m-play" data-act="play">Play</button>
        <button class="m-ghost" data-act="autoplay">Autoplay</button>
        <div class="m-level" role="radiogroup" aria-label="Start difficulty"></div>
        <div class="m-level m-vehicle" role="radiogroup" aria-label="Vehicle"><button type="button" role="radio" data-vehicle="ball">Ball</button><button type="button" role="radio" data-vehicle="cycle">Light cycle</button></div>
        <form class="m-seed"><input placeholder="seed (optional)" spellcheck="false" autocomplete="off" maxlength="32" aria-label="Seed" /><button type="submit">Go</button></form>
        <button class="m-ghost" data-act="settings">Settings</button>
      </div>
      <div class="m-best"></div>
      <div class="m-tracks"></div>
      <div class="m-keys"><kbd>←</kbd><kbd>→</kbd> steer · <kbd>esc</kbd> pause · <kbd>`</kbd> settings</div>
    </section>
    <section id="pause" hidden aria-label="Paused">
      <div class="p-title">PAUSED</div>
      <div class="p-seed"></div>
      <button data-act="resume">Resume</button>
      <button data-act="restart">Restart run</button>
      <button data-act="newSeed">New seed</button>
      <button data-act="saveTrack" class="p-save">Save track</button>
      <button data-act="toggleAutoplay" class="p-auto">Autoplay: off</button>
      <button data-act="settings">Settings</button>
      <button data-act="quit">Main menu</button>
    </section>
    <section id="summary" hidden>
      <div class="s-cause"></div>
      <div class="s-score"></div>
      <div class="s-run"></div>
      <div class="s-stats"></div>
      <form class="s-seed">
        <label for="seed-in">seed</label>
        <input id="seed-in" spellcheck="false" autocomplete="off" maxlength="32" />
        <button type="submit">play</button>
        <button type="button" class="s-save">save track</button>
      </form>
      <div class="s-keys"><kbd>space</kbd> retry this seed · <kbd>R</kbd> new seed · <kbd>M</kbd> menu</div>
    </section>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
